# 단일 컨테이너. 기본은 lazy/local: 모델이 없어도 서버는 뜨고 /predict만 503.
# 런타임 데이터는 이름 있는 볼륨에 둔다 - `down`/재빌드 후에도 남고, `down -v`로만 지워진다.
# 호스트 mlflow.db는 공유하지 않는다(아티팩트 경로가 호스트 절대경로라 컨테이너에서 못 찾음).
services:
  serving-app:
    build:
      context: ..
      dockerfile: serving_app/Dockerfile
    ports: ["8000:8000"]
    restart: unless-stopped
    environment:
      MODEL_SOURCE: ${MODEL_SOURCE:-local}
      LOADING_MODE: ${LOADING_MODE:-lazy}
      MLFLOW_TRACKING_URI: sqlite:////app/runtime/mlflow.db
      AIOPS_ALERT_WEBHOOK_URL: ${AIOPS_ALERT_WEBHOOK_URL:-}
      AIOPS_ALERT_FILE: ${AIOPS_ALERT_FILE:-logs/alerts.jsonl}
      AIOPS_ALERT_TIMEOUT: ${AIOPS_ALERT_TIMEOUT:-5}
      AIOPS_ALERT_DEDUP_SECONDS: ${AIOPS_ALERT_DEDUP_SECONDS:-3600}
      RETRAIN_COOLDOWN_SECONDS: ${RETRAIN_COOLDOWN_SECONDS:-600}
      DIESEL_DATA_SYNTHETIC: ${DIESEL_DATA_SYNTHETIC:-false}
      DIESEL_DATA_CSV: ${DIESEL_DATA_CSV:-data/processed/diesel_features_2008_spliced.csv}
    volumes:
      - uploads:/app/data/uploads
      - processed:/app/data/processed
      - models:/app/serving_app/models
      - logs:/app/logs
      - mlflow-db:/app/runtime
      - mlruns:/app/mlruns

volumes:
  uploads:
  processed:
  models:
  logs:
  mlflow-db:
  mlruns:
